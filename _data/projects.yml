- category: research
  title: "CVGL-SLAM: Satellite Imagery as an Absolute Constraint for Drift-Bounded SLAM"
  venue: In preparation
  thumb: /assets/img/projects/cvgl-slam.jpg
  page: "/projects/cvgl-slam"
  summary: Bounds odometry drift without loop closure by matching the robot's view to satellite imagery and adding confident matches to a pose graph.
  links: []

- category: research
  title: "SE(3)-LIO: Smooth IMU Propagation With Jointly Distributed Poses on SE(3) Manifold"
  venue: ICRA 2026
  thumb: /assets/img/projects/se3-lio.gif
  page: "/se3-lio/"
  summary: LiDAR-inertial odometry that propagates the IMU state jointly on SE(3), staying accurate under fast motion and vibration.
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2603.16118
    - name: code
      url: https://github.com/url-kaist/se3-lio

- category: research
