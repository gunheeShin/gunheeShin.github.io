      url: https://arxiv.org/abs/2610.04552

- category: research
  title: "NM-LIO: Multiple LiDAR-Inertial Odometry Addressing LiDAR Measurement Noise Discrepancy"
  venue: RiTA 2024
  thumb: /assets/img/projects/nm-lio.jpg
  page: ""
